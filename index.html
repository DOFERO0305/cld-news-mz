<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acompanhe as melhores histórias antigas e contos do passado atualizados em tempo real.">
    <title>Histórias Antigas | Reels</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Variáveis de Tema - Estilo Antigo/Premium */
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --text-primary: #c5c6c7;
            --text-title: #f2e3c6;
            --accent-gold: #d4af37;
            --accent-hover: #b5952f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho */
        header {
            background-color: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 2rem 5%;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1rem;
            color: var(--text-primary);
            opacity: 0.8;
        }

        /* Container Principal */
        main {
            flex: 1;
            padding: 3rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Estado de Carregamento */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 50vh;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            border-top-color: var(--accent-gold);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Grid de Reels */
        .reels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            display: none; /* Escondido até carregar */
        }

        /* Cartão do Reel */
        .reel-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .reel-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .card-media {
            width: 100%;
            padding-top: 133%; /* Proporção padrão de Reel/Stories (4:3 ou 16:9 vertical) */
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        .card-media img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .reel-card:hover .card-media img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-content h2 {
            font-family: 'Cinzel', serif;
            color: var(--text-title);
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .card-content p {
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            flex: 1;
            opacity: 0.9;
        }

        .btn-instagram {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background-color: transparent;
            color: var(--accent-gold);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--accent-gold);
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-instagram:hover {
            background-color: var(--accent-gold);
            color: var(--bg-color);
        }

        /* Mensagem de Erro */
        .error-message {
            text-align: center;
            color: #ff6b6b;
            padding: 2rem;
            font-size: 1.2rem;
            display: none;
        }

        /* Rodapé */
        footer {
            background-color: #050608;
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .reels-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Histórias Antigas</h1>
        <p>Explore os mistérios e as lendas do nosso passado</p>
    </header>

    <main>
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 1rem; color: var(--accent-gold); font-family: 'Cinzel', serif;">Desenterrando os arquivos...</p>
        </div>

        <div class="error-message" id="error-msg">
            <i class="fas fa-exclamation-triangle"></i> Não foi possível carregar as histórias no momento. Tente novamente mais tarde.
        </div>

        <div class="reels-grid" id="reels-container">
            </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Histórias Antigas. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Define o ano atual no rodapé
        document.getElementById('year').textContent = new Date().getFullYear();

        // Configurações do Feed
        const feedUrl = 'https://rss.app/feeds/v1.1/PDQAMdRWA2z7DOqb.json';
        const container = document.getElementById('reels-container');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');

        // Função para buscar e renderizar o feed
        async function loadReels() {
            try {
                const response = await fetch(feedUrl);
                
                if (!response.ok) {
                    throw new Error(`Erro HTTP: ${response.status}`);
                }

                const data = await response.json();
                const items = data.items;

                if (items && items.length > 0) {
                    renderCards(items);
                } else {
                    throw new Error("Nenhum item encontrado no feed.");
                }

            } catch (error) {
                console.error("Erro ao carregar o feed:", error);
                loader.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        // Função para criar o HTML de cada card
        function renderCards(items) {
            let htmlContent = '';

            items.forEach(item => {
                // Tenta extrair a melhor imagem disponível no JSON
                let imageUrl = 'https://images.unsplash.com/photo-1461360370896-922624d12aa1?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'; // Imagem de fallback genérica
                
                if (item.image) {
                    imageUrl = item.image;
                } else if (item.attachments && item.attachments.length > 0 && item.attachments[0].url) {
                    imageUrl = item.attachments[0].url;
                }

                // Limpa o texto da descrição (remove tags HTML se houver e limita o tamanho)
                let description = item.content_text || item.summary || 'Assista a este reel incrível diretamente no Instagram.';
                if (description.length > 120) {
                    description = description.substring(0, 120) + '...';
                }
                
                // Formata o título
                let title = item.title || 'História Oculta';

                htmlContent += `
                    <article class="reel-card">
                        <div class="card-media">
                            <img src="${imageUrl}" alt="${title}" loading="lazy">
                        </div>
                        <div class="card-content">
                            <h2>${title}</h2>
                            <p>${description}</p>
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-instagram">
                                <i class="fab fa-instagram"></i> Assistir Reel
                            </a>
                        </div>
                    </article>
                `;
            });

            // Esconde o loader e mostra o grid
            loader.style.display = 'none';
            container.innerHTML = htmlContent;
            container.style.display = 'grid';
        }

        // Inicia o processo
        loadReels();
    </script>
</body>
</html>
