<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Assista a episódios completos de histórias antigas diretamente aqui.">
    <title>Histórias Antigas | Episódios</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --text-primary: #c5c6c7;
            --text-title: #f2e3c6;
            --accent-gold: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 5%;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 2rem;
        }

        main { flex: 1; padding: 2rem 5%; max-width: 1200px; margin: 0 auto; width: 100%; }

        /* Loader */
        .loader-container { display: flex; justify-content: center; align-items: center; height: 30vh; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.3); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Grid View */
        #grid-view { display: none; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        
        .reel-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .reel-card:hover { transform: translateY(-5px); border-color: var(--accent-gold); }
        .card-media { width: 100%; padding-top: 133%; position: relative; background: #000; }
        .card-media img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 1rem; }
        .card-content h3 { font-family: 'Cinzel', serif; color: var(--text-title); font-size: 1.1rem; }

        /* Detail View (Player Area) */
        #detail-view { display: none; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-back {
            background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold);
            padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
            margin-bottom: 2rem; transition: 0.3s;
        }
        .btn-back:hover { background: var(--accent-gold); color: var(--bg-color); }

        .player-wrapper {
            display: flex; gap: 2rem; align-items: flex-start;
            background: var(--surface-color); padding: 2rem; border-radius: 12px;
        }

        .video-container {
            flex: 0 0 350px; /* Largura padrão do IG Reel */
            width: 350px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-container iframe { width: 100%; height: 580px; border: none; }

        .video-info { flex: 1; }
        .video-info h2 { font-family: 'Cinzel', serif; color: var(--text-title); font-size: 1.8rem; margin-bottom: 1rem; }
        .video-info p { color: #aaa; font-size: 1rem; white-space: pre-wrap; margin-bottom: 2rem; }

        /* Seção de Relacionados */
        .related-section { margin-top: 3rem; }
        .related-section h3 { font-family: 'Cinzel', serif; color: var(--accent-gold); border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        #related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }

        @media (max-width: 768px) {
            .player-wrapper { flex-direction: column; padding: 1rem; }
            .video-container { flex: none; width: 100%; max-width: 400px; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Histórias Antigas</h1>
    </header>

    <main>
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
        </div>

        <div id="grid-view"></div>

        <div id="detail-view">
            <button class="btn-back" onclick="showGrid()"><i class="fas fa-arrow-left"></i> Voltar para os Episódios</button>
            
            <div class="player-wrapper">
                <div class="video-container" id="iframe-container">
                    </div>
                <div class="video-info">
                    <h2 id="video-title"></h2>
                    <p id="video-desc"></p>
                </div>
            </div>

            <div class="related-section">
                <h3>Episódios Relacionados</h3>
                <div id="related-grid"></div>
            </div>
        </div>
    </main>

    <script>
        const feedUrl = 'https://rss.app/feeds/v1.1/PDQAMdRWA2z7DOqb.json';
        let allItems = []; // Armazena todos os itens do feed

        // Elementos da DOM
        const loader = document.getElementById('loader');
        const gridView = document.getElementById('grid-view');
        const detailView = document.getElementById('detail-view');

        async function fetchFeed() {
            try {
                // Utilizando um proxy CORS nativo gratuito para garantir que sempre carregue
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`);
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);
                
                if (data.items && data.items.length > 0) {
                    allItems = data.items;
                    renderGrid(allItems, gridView);
                    loader.style.display = 'none';
                    gridView.style.display = 'grid';
                }
            } catch (error) {
                loader.innerHTML = "<p style='color:red;'>Erro ao carregar os episódios. Tente atualizar a página.</p>";
            }
        }

        // Renderiza o formato de "Capa"
        function renderGrid(items, container) {
            container.innerHTML = '';
            items.forEach((item, index) => {
                // Encontra a imagem de capa (no JSON do rss.app)
                let imageUrl = item.image || (item.attachments && item.attachments[0] ? item.attachments[0].url : 'https://via.placeholder.com/400x600/1f2833/d4af37?text=Hist%C3%B3ria');
                let title = item.title || 'História Sem Título';

                // Usamos o índice original do array geral para saber qual vídeo abrir
                let globalIndex = allItems.findIndex(i => i.id === item.id);

                container.innerHTML += `
                    <div class="reel-card" onclick="openVideo(${globalIndex})">
                        <div class="card-media">
                            <img src="${imageUrl}" alt="Capa" loading="lazy">
                        </div>
                        <div class="card-content">
                            <h3>${title}</h3>
                        </div>
                    </div>
                `;
            });
        }

        // Abre o vídeo selecionado
        function openVideo(index) {
            const item = allItems[index];
            
            // Oculta grid, mostra player
            gridView.style.display = 'none';
            detailView.style.display = 'block';
            window.scrollTo(0, 0);

            // Preenche Título e Descrição
            document.getElementById('video-title').textContent = item.title || 'Episódio';
            document.getElementById('video-desc').textContent = item.content_text || item.summary || 'Sem descrição disponível.';

            // Gera o link Embed do Instagram
            // O link original geralmente é: https://www.instagram.com/reel/ID/
            // Precisamos converter para: https://www.instagram.com/reel/ID/embed
            let igUrl = item.url.split('?')[0]; // Remove parâmetros de rastreamento
            if(!igUrl.endsWith('/')) igUrl += '/';
            let embedUrl = igUrl + 'embed/';

            document.getElementById('iframe-container').innerHTML = `
                <iframe src="${embedUrl}" width="100%" height="580" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            `;

            // Chama algoritmo de relacionados
            loadRelated(index);
        }

        // Retorna para a página principal
        function showGrid() {
            detailView.style.display = 'none';
            gridView.style.display = 'grid';
            document.getElementById('iframe-container').innerHTML = ''; // Para o vídeo
        }

        // Algoritmo para encontrar vídeos relacionados
        function loadRelated(currentIndex) {
            const currentItem = allItems[currentIndex];
            const relatedGrid = document.getElementById('related-grid');
            
            // Extrai palavras-chave do título atual (com mais de 3 letras)
            const keywords = (currentItem.title || "").toLowerCase().match(/\b\w{4,}\b/g) || [];

            let scoredItems = allItems.map((item, idx) => {
                if (idx === currentIndex) return { item, score: -1 }; // Ignora o próprio vídeo
                
                let score = 0;
                let textToSearch = ((item.title || "") + " " + (item.content_text || "")).toLowerCase();
                
                keywords.forEach(word => {
                    if (textToSearch.includes(word)) score++;
                });

                return { item, score };
            });

            // Ordena por maior pontuação (mais relevância) e pega os 4 primeiros
            scoredItems = scoredItems.filter(s => s.score >= 0).sort((a, b) => b.score - a.score).slice(0, 4);
            
            // Extrai apenas os objetos 'item' para renderizar
            const relatedItemsToRender = scoredItems.map(s => s.item);
            
            // Renderiza no grid inferior
            renderGrid(relatedItemsToRender, relatedGrid);
        }

        // Inicializa
        fetchFeed();
    </script>
</body>
</html>
