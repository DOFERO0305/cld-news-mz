<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Assista a episódios completos de histórias antigas diretamente aqui.">
    <meta name="referrer" content="no-referrer">
    <title>Histórias Antigas | Episódios Atualizados</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #0b0c10;
            --surface-color: #1f2833;
            --text-primary: #c5c6c7;
            --text-title: #f2e3c6;
            --accent-gold: #d4af37;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 5%;
            text-align: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            font-size: 2rem;
        }

        main { flex: 1; padding: 2rem 5%; max-width: 1200px; margin: 0 auto; width: 100%; }

        /* Loader */
        .loader-container { display: flex; justify-content: center; align-items: center; height: 30vh; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(212, 175, 55, 0.3); border-top-color: var(--accent-gold); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Grid View */
        #grid-view { display: none; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1.5rem; }
        
        .reel-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .reel-card:hover { transform: translateY(-5px); border-color: var(--accent-gold); }
        .card-media { width: 100%; padding-top: 133%; position: relative; background: #000; }
        .card-media img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* Badge de Tempo */
        .time-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 10;
        }

        .card-content { padding: 1rem; }
        .card-content h3 { font-family: 'Cinzel', serif; color: var(--text-title); font-size: 1.1rem; }

        /* Detail View (Player Area) */
        #detail-view { display: none; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .btn-back {
            background: transparent; color: var(--accent-gold); border: 1px solid var(--accent-gold);
            padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
            margin-bottom: 2rem; transition: 0.3s;
        }
        .btn-back:hover { background: var(--accent-gold); color: var(--bg-color); }

        .player-wrapper {
            display: flex; gap: 2rem; align-items: flex-start;
            background: var(--surface-color); padding: 2rem; border-radius: 12px;
        }

        .video-container {
            flex: 0 0 350px;
            width: 350px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Ajuste do iframe para remover o máximo possível do Instagram */
        .video-container iframe { width: 100%; height: 580px; border: none; }

        .video-info { flex: 1; }
        .video-info h2 { font-family: 'Cinzel', serif; color: var(--text-title); font-size: 1.8rem; margin-bottom: 0.5rem; }
        .video-time { color: var(--accent-gold); font-size: 0.9rem; margin-bottom: 1.5rem; display: block; font-weight: 600; }
        .video-info p { color: #aaa; font-size: 1rem; white-space: pre-wrap; margin-bottom: 2rem; }

        /* Seção de Relacionados */
        .related-section { margin-top: 3rem; }
        .related-section h3 { font-family: 'Cinzel', serif; color: var(--accent-gold); border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        #related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }

        @media (max-width: 768px) {
            .player-wrapper { flex-direction: column; padding: 1rem; }
            .video-container { flex: none; width: 100%; max-width: 400px; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Histórias Antigas</h1>
    </header>

    <main>
        <div class="loader-container" id="loader">
            <div class="spinner"></div>
        </div>

        <div id="grid-view"></div>

        <div id="detail-view">
            <button class="btn-back" onclick="showGrid()"><i class="fas fa-arrow-left"></i> Voltar para os Episódios</button>
            
            <div class="player-wrapper">
                <div class="video-container" id="iframe-container">
                    </div>
                <div class="video-info">
                    <h2 id="video-title"></h2>
                    <span id="video-time" class="video-time"></span>
                    <p id="video-desc"></p>
                </div>
            </div>

            <div class="related-section">
                <h3>Episódios Relacionados</h3>
                <div id="related-grid"></div>
            </div>
        </div>
    </main>

    <script>
        const feedUrl = 'https://rss.app/feeds/v1.1/PDQAMdRWA2z7DOqb.json';
        let allItems = []; 

        const loader = document.getElementById('loader');
        const gridView = document.getElementById('grid-view');
        const detailView = document.getElementById('detail-view');

        // Função para formatar a data/hora (Ex: "Hoje às 14:30" ou "10/04/2026 às 15:00")
        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('pt-PT', { 
                day: '2-digit', month: '2-digit', year: 'numeric', 
                hour: '2-digit', minute: '2-digit' 
            });
        }

        async function fetchFeed() {
            try {
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`);
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);
                
                if (data.items && data.items.length > 0) {
                    // Ordena os itens do mais recente para o mais antigo usando a data de publicação
                    allItems = data.items.sort((a, b) => new Date(b.date_published) - new Date(a.date_published));
                    
                    renderGrid(allItems, gridView);
                    loader.style.display = 'none';
                    gridView.style.display = 'grid';
                }
            } catch (error) {
                loader.innerHTML = "<p style='color:red;'>Erro ao carregar os episódios.</p>";
            }
        }

        function renderGrid(items, container) {
            container.innerHTML = '';
            items.forEach((item, index) => {
                // Extração robusta da imagem
                let imageUrl = 'https://via.placeholder.com/400x600/1f2833/d4af37?text=Sem+Capa';
                if (item.image) {
                    imageUrl = item.image;
                } else if (item.attachments && item.attachments.length > 0) {
                    const imgAttachment = item.attachments.find(a => a.mime_type && a.mime_type.startsWith('image/'));
                    if (imgAttachment) imageUrl = imgAttachment.url;
                }

                let title = item.title || 'História Sem Título';
                let timeString = formatTime(item.date_published);
                
                let globalIndex = allItems.findIndex(i => i.id === item.id);

                container.innerHTML += `
                    <div class="reel-card" onclick="openVideo(${globalIndex})">
                        <div class="time-badge"><i class="far fa-clock"></i> ${timeString}</div>
                        <div class="card-media">
                            <img src="${imageUrl}" alt="Capa" loading="lazy">
                        </div>
                        <div class="card-content">
                            <h3>${title}</h3>
                        </div>
                    </div>
                `;
            });
        }

        function openVideo(index) {
            const item = allItems[index];
            
            gridView.style.display = 'none';
            detailView.style.display = 'block';
            window.scrollTo(0, 0);

            document.getElementById('video-title').textContent = item.title || 'Episódio';
            document.getElementById('video-time').innerHTML = `<i class="far fa-clock"></i> Atualizado em: ${formatTime(item.date_published)}`;
            document.getElementById('video-desc').textContent = item.content_text || item.summary || 'Sem descrição disponível.';

            // Limpa URL e adiciona embed com hidecaption=true para ocultar o texto do post
            let igUrl = item.url.split('?')[0]; 
            if(!igUrl.endsWith('/')) igUrl += '/';
            // hidecaption=true esconde as descrições originais do Instagram deixando apenas o vídeo
            let embedUrl = igUrl + 'embed/?hidecaption=true';

            document.getElementById('iframe-container').innerHTML = `
                <iframe src="${embedUrl}" width="100%" height="580" frameborder="0" scrolling="no" allowtransparency="true"></iframe>
            `;

            loadRelated(index);
        }

        function showGrid() {
            detailView.style.display = 'none';
            gridView.style.display = 'grid';
            document.getElementById('iframe-container').innerHTML = ''; 
        }

        function loadRelated(currentIndex) {
            const currentItem = allItems[currentIndex];
            const relatedGrid = document.getElementById('related-grid');
            const keywords = (currentItem.title || "").toLowerCase().match(/\b\w{4,}\b/g) || [];

            let scoredItems = allItems.map((item, idx) => {
                if (idx === currentIndex) return { item, score: -1 }; 
                let score = 0;
                let textToSearch = ((item.title || "") + " " + (item.content_text || "")).toLowerCase();
                keywords.forEach(word => { if (textToSearch.includes(word)) score++; });
                return { item, score };
            });

            scoredItems = scoredItems.filter(s => s.score >= 0).sort((a, b) => b.score - a.score).slice(0, 4);
            renderGrid(scoredItems.map(s => s.item), relatedGrid);
        }

        fetchFeed();
    </script>
</body>
</html>
